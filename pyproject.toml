[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lnckit"
version = "0.1.0"
description = "A comprehensive toolkit for lncRNA identification and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

authors = [
    {name = "Priyanka Rattan"}
]

dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "packaging>=24.0"
]

# The pipeline is launched with ./lnckit.sh (which puts the tools on PATH); there is no
# separate console entry point to keep.
